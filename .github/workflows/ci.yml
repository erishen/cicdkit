name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/server/web/package-lock.json

      # Build the frontend first so that web/dist exists for the Go //go:embed.
      # The committed lockfile uses the China mirror (registry.npmmirror.com) so the
      # developer's local `npm ci` works behind the GFW; GitHub runners are in the US,
      # where registry.npmjs.org is far faster/more reliable. Rewrite tarball hosts
      # (npmmirror path layout matches npmjs.org exactly — only the host changes,
      # integrity hashes are untouched, so this is safe).
      - name: Rewrite lockfile to npmjs.org for CI
        working-directory: cmd/server/web
        run: sed -i 's#registry.npmmirror.com#registry.npmjs.org#g' package-lock.json

      - name: Build frontend
        working-directory: cmd/server/web
        run: npm ci && npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./...
